# Features that match the Omarchy tmux configuration.
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',*:RGB'
set -ag terminal-features 'xterm-kitty:extkeys'
set -as terminal-features ',*:clipboard'
# set -g default-command "/usr/bin/env zsh"

# Do not disconnect when closing the last pane.
set -g detach-on-destroy off

# Number windows and panes from 1, and close the gaps after a close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep more history and pass terminal events to the programs.
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10

# Name each window after the directory of its pane.
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

#Allow mouse usage
set -g mouse off

# Shift + arrows to resize pane
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

bind -n M-{ previous-window
bind -n M-\" next-window

# Setup workspaces.
bind -r a run-shell "w.j"
bind -r G run-shell "w current"
bind -r F run-shell "w support"
bind -r D run-shell "w dotfiles"
bind -r S run-shell "w ssh"
bind -r w run-shell "w"
bind -r W run-shell "w.tree #{pane_current_path}"
bind -r H run-shell "g.bhist"
bind -r J run-shell "g.bselect"
bind -r K run-shell "g.bselect -r"

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle windows (tabs)
bind -n C-w previous-window
bind -n C-e next-window

# Zoom bottom half.
bind Z resize-pane -Z -t "{down-of}"

# Scroll
bind [ copy-mode
bind ] paste-buffer
bind = choose-buffer
# Space Bar to begin highlighting, Enter to copy.

# reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# switch to last pane
bind-key C-b last-pane

# split the window
bind-key \\ split-window -h -c '#{?CURRENT_DIR,#{CURRENT_DIR},#{pane_current_path}}'
bind-key | split-window -h -c '#{?CURRENT_DIR,#{CURRENT_DIR},#{pane_current_path}}'
bind-key - split-window -v -c '#{?CURRENT_DIR,#{CURRENT_DIR},#{pane_current_path}}'
bind-key c new-window -c '#{?CURRENT_DIR,#{CURRENT_DIR},#{pane_current_path}}'
bind -n C-k send-keys -R \; clear-history
# Split pane to new window
bind-key + break-pane -t :
# Unsplit the window.
bind-key = command-prompt -p "join current pane to window id: "  "join-pane -h -s '%%'"

# Rename the current window
bind-key R command-prompt -p "New name: "  "rename-window '%%'"

# Allow scrolling around the screen.
# This is a default, but here for reference.
# bind-key [ copy-mode

# Colours and stuff.
set -g status-interval 1
set -g status-style "bg=#000000,fg=#99ff99"
set -g status-position top
set -g status-left-length 30
set -g status-right-length 100
set -g window-status-separator ""

# Omarchy layout: session badge on the left, mode flags on the right.
set -g status-left "#[fg=#000000,bg=#99ff99,bold] #S #[bg=#000000] "
set -g status-right "#[fg=#99ff99]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#[fg=brightblack]%F %-l:%M %0z "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=#99ff99,bold] #I:#W "
set -g pane-border-style "fg=#99ff99 bg=#000000"
set -g pane-active-border-style "bg=#005500 fg=#99ff99"
set -g message-style "bg=#000000,fg=#99ff99"
set -g message-command-style "bg=#000000,fg=#99ff99"
set -g mode-style "bg=#99ff99,fg=#000000"
setw -g clock-mode-colour "#99ff99"

# Prompt for a command and run it in a popup in the current directory.
# `!` closes the popup when the command exits.
bind-key ! command-prompt -p "run in popup: " "display-popup -E -w 40% -h 40% -d '#{pane_current_path}' \"%1\""
# `@` uses `confirm` to hold the popup open until a key is pressed.
bind-key @ command-prompt -p "run in popup (hold): " "display-popup -E -w 40% -h 40% -d '#{pane_current_path}' \"%1; confirm 'Close?'\""

# Popups share the pane border theme.
set -g popup-border-style "fg=#99ff99 bg=#000000"
set -g popup-style "bg=#000000"
